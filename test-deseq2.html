<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>webR + DESeq2 diagnostic test</title>

  <style>
    body {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      line-height: 1.6;
    }

    h1 {
      margin-bottom: 8px;
    }

    button {
      padding: 10px 20px;
      border: 1px solid #999;
      border-radius: 6px;
      background: #fff;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    pre {
      min-height: 400px;
      margin-top: 20px;
      padding: 16px;
      overflow-x: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #f5f5f5;
      font-family:
        Consolas,
        Monaco,
        "Courier New",
        monospace;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <h1>webR + DESeq2 diagnostic test</h1>

  <p>
    This page loads DESeq2 and its required packages in the browser,
    then runs a test analysis with synthetic count data.
  </p>

  <button id="run" type="button">
    Run DESeq2
  </button>

  <pre id="output">Not started</pre>

  <script type="module">
    const htmlVersion =
      "20260714-1";

    /*
     * Update this value when library.data.gz or library.js.metadata changes.
     */
    const libraryVersion =
      "20260714-1";

    const runButton =
      document.getElementById("run");

    const output =
      document.getElementById("output");

    const decoder =
      new TextDecoder("utf-8");

    function show(message) {
      output.textContent =
        String(message);
    }

    function append(message = "") {
      output.textContent +=
        "\n" + String(message);

      output.scrollTop =
        output.scrollHeight;
    }

    function formatError(error) {
      if (error === null) {
        return "null";
      }

      if (error === undefined) {
        return "undefined";
      }

      if (typeof error === "string") {
        return error;
      }

      const parts = [];

      if (error.name) {
        parts.push(
          "Name: " + error.name
        );
      }

      if (error.message) {
        parts.push(
          "Message: " + error.message
        );
      }

      if (error.stack) {
        parts.push(
          "Stack:\n" + error.stack
        );
      }

      return parts.length > 0
        ? parts.join("\n\n")
        : String(error);
    }

    function parsePackageList(text) {
      return new Set(
        text
          .split(",")
          .map(
            name => name.trim()
          )
          .filter(Boolean)
      );
    }

    /*
     * Paint "Loading package..." in the browser before running R code.
     *
     * If the worker stops, the last package name stays visible on the page.
     */
    async function nextPaint() {
      await new Promise(
        resolve => {
          requestAnimationFrame(
            () => {
              requestAnimationFrame(
                resolve
              );
            }
          );
        }
      );
    }

    async function loadRPackage(
      webR,
      packageName
    ) {
      const packageLiteral =
        JSON.stringify(packageName);

      /*
       * Use only the smallest valid R code here.
       * Do not add complex warning handlers.
       */
      const rCode = `
        tryCatch(
          {
            suppressPackageStartupMessages(
              library(
                ${packageLiteral},
                character.only = TRUE
              )
            )

            paste0(
              "OK|",
              as.character(
                packageVersion(
                  ${packageLiteral}
                )
              )
            )
          },
          error = function(e) {
            paste0(
              "ERROR|",
              conditionMessage(e)
            )
          }
        )
      `;

      const result =
        await webR.evalRString(
          rCode
        );

      if (
        result.startsWith(
          "ERROR|"
        )
      ) {
        throw new Error(
          "Package: " +
          packageName +
          "\nR error: " +
          result.substring(
            "ERROR|".length
          )
        );
      }

      if (
        !result.startsWith(
          "OK|"
        )
      ) {
        throw new Error(
          "Package: " +
          packageName +
          "\nUnknown result: " +
          result
        );
      }

      return result.substring(
        "OK|".length
      );
    }

    runButton.addEventListener(
      "click",
      async () => {
        runButton.disabled = true;

        let webR = null;

        try {
          /*
           * 1. Initialize webR
           */
          show(
            "Diagnostic HTML version: " +
            htmlVersion +
            "\n\n" +
            "1/8 Loading webR..."
          );

          const baseUrl =
            new URL(
              "./webr/",
              window.location.href
            ).href;

          const moduleUrl =
            new URL(
              "webr.js",
              baseUrl
            ).href;

          append(
            "webR module URL: " +
            moduleUrl
          );

          const {
            WebR,
            ChannelType
          } = await import(
            moduleUrl
          );

          webR =
            new WebR({
              baseUrl,
              channelType:
                ChannelType.PostMessage
            });

          await webR.init();

          append(
            "webR initialized."
          );

          const runtimeInformation =
            await webR.evalRString(`
              paste(
                R.version.string,
                R.version$platform,
                sep = "\\n"
              )
            `);

          append(
            "Runtime information:\n" +
            runtimeInformation
          );

          /*
           * 2. Download the library image
           */
          append("");
          append(
            "2/8 Downloading DESeq2 library image..."
          );

          const libraryDataUrl =
            new URL(
              "./library/library.data.gz" +
              "?v=" +
              encodeURIComponent(
                libraryVersion
              ),
              window.location.href
            ).href;

          const metadataUrl =
            new URL(
              "./library/library.js.metadata" +
              "?v=" +
              encodeURIComponent(
                libraryVersion
              ),
              window.location.href
            ).href;

          append(
            "Library version: " +
            libraryVersion
          );

          append(
            "Data URL: " +
            libraryDataUrl
          );

          append(
            "Metadata URL: " +
            metadataUrl
          );

          const [
            dataResponse,
            metadataResponse
          ] = await Promise.all([
            fetch(
              libraryDataUrl,
              {
                cache: "no-store"
              }
            ),

            fetch(
              metadataUrl,
              {
                cache: "no-store"
              }
            )
          ]);

          if (!dataResponse.ok) {
            throw new Error(
              "Failed to download library.data.gz." +
              "\nHTTP status: " +
              dataResponse.status +
              " " +
              dataResponse.statusText
            );
          }

          if (!metadataResponse.ok) {
            throw new Error(
              "Failed to download library.js.metadata." +
              "\nHTTP status: " +
              metadataResponse.status +
              " " +
              metadataResponse.statusText
            );
          }

          const libraryBlob =
            await dataResponse.blob();

          const metadata =
            await metadataResponse.json();

          append(
            "Downloaded library.data.gz: " +
            libraryBlob.size.toLocaleString() +
            " bytes"
          );

          append(
            "Metadata gzip: " +
            String(
              metadata.gzip
            )
          );

          /*
           * 3. Create the mount point
           */
          append("");
          append(
            "3/8 Creating mount point..."
          );

          try {
            await webR.FS.mkdir(
              "/deseq2-library"
            );

            append(
              "Mount point created."
            );
          } catch (error) {
            append(
              "Mount point already exists or could not be created."
            );

            append(
              formatError(error)
            );
          }

          /*
           * 4. Mount the filesystem image
           */
          append("");
          append(
            "4/8 Mounting DESeq2 library..."
          );

          await webR.FS.mount(
            "WORKERFS",
            {
              packages: [
                {
                  blob:
                    libraryBlob,

                  metadata:
                    metadata
                }
              ]
            },
            "/deseq2-library"
          );

          append(
            "Library mounted."
          );

          /*
           * 5. Check the package list
           */
          append("");
          append(
            "5/8 Checking mounted packages..."
          );

          const packageText =
            await webR.evalRString(`
              paste(
                sort(
                  list.files(
                    "/deseq2-library"
                  )
                ),
                collapse = ", "
              )
            `);

          append(
            "Mounted packages:\n" +
            packageText
          );

          const mountedPackages =
            parsePackageList(
              packageText
            );

          const requiredPackages = [
            "DESeq2",
            "locfit",
            "Rcpp",
            "RcppArmadillo",
            "Biobase",
            "BiocGenerics",
            "BiocParallel",
            "S4Vectors",
            "IRanges",
            "XVector",
            "S4Arrays",
            "SparseArray",
            "DelayedArray",
            "Matrix",
            "MatrixGenerics",
            "Seqinfo",
            "GenomicRanges",
            "SummarizedExperiment",
            "matrixStats",
            "ggplot2"
          ];

          const missingPackages =
            requiredPackages.filter(
              packageName =>
                !mountedPackages.has(
                  packageName
                )
            );

          if (
            missingPackages.length > 0
          ) {
            throw new Error(
              "The filesystem image is missing required packages." +
              "\n\nMissing packages:\n" +
              missingPackages
                .map(
                  packageName =>
                    "- " + packageName
                )
                .join("\n")
            );
          }

          append("");
          append(
            "All required package directories are present."
          );

          /*
           * 6. Set R library paths
           */
          append("");
          append(
            "6/8 Configuring R library paths..."
          );

          await webR.evalRVoid(`
            .libPaths(
              unique(
                c(
                  "/deseq2-library",
                  .libPaths()
                )
              )
            )
          `);

          const libraryPaths =
            await webR.evalRString(`
              paste(
                .libPaths(),
                collapse = " | "
              )
            `);

          append(
            ".libPaths(): " +
            libraryPaths
          );

          /*
           * 7. Load packages one by one
           */
          append("");
          append(
            "7/8 Loading R packages one by one..."
          );

          const packagesToLoad = [
            "BiocGenerics",
            "S4Vectors",
            "IRanges",
            "XVector",
            "S4Arrays",
            "SparseArray",
            "DelayedArray",
            "Matrix",
            "MatrixGenerics",
            "Seqinfo",
            "GenomicRanges",
            "Biobase",
            "SummarizedExperiment",
            "BiocParallel",
            "matrixStats",
            "locfit",
            "ggplot2",
            "Rcpp",
            "RcppArmadillo",
            "DESeq2"
          ];

          const loadedVersions = {};

          for (
            const packageName
            of packagesToLoad
          ) {
            append(
              "Loading " +
              packageName +
              "..."
            );

            await nextPaint();

            try {
              const packageVersion =
                await loadRPackage(
                  webR,
                  packageName
                );

              loadedVersions[
                packageName
              ] =
                packageVersion;

              append(
                "OK: " +
                packageName +
                " " +
                packageVersion
              );
            } catch (error) {
              throw new Error(
                "Stopped while loading packages one by one." +
                "\n\nStopped package: " +
                packageName +
                "\n\n" +
                formatError(error)
              );
            }
          }

          append("");
          append(
            "DESeq2 and all dependencies loaded successfully."
          );

          /*
           * 8. Run the DESeq2 test analysis
           */
          append("");
          append(
            "8/8 Running DESeq2 test analysis..."
          );

          await nextPaint();

          const analysisCode = `
            tryCatch(
              {
                set.seed(123)

                n_genes <- 100L
                n_samples <- 6L

                condition <- factor(
                  c(
                    "control",
                    "control",
                    "control",
                    "treatment",
                    "treatment",
                    "treatment"
                  ),
                  levels = c(
                    "control",
                    "treatment"
                  )
                )

                sample_names <- paste0(
                  "sample_",
                  seq_len(n_samples)
                )

                sample_data <- data.frame(
                  condition = condition,
                  row.names = sample_names
                )

                base_mean <- 2^runif(
                  n_genes,
                  min = 4,
                  max = 10
                )

                expected_mean <- matrix(
                  rep(
                    base_mean,
                    n_samples
                  ),
                  nrow = n_genes,
                  ncol = n_samples
                )

                expected_mean[
                  1:10,
                  4:6
                ] <- expected_mean[
                  1:10,
                  4:6
                ] * 4

                count_matrix <- matrix(
                  rnbinom(
                    n_genes * n_samples,
                    mu = as.vector(
                      expected_mean
                    ),
                    size = 20
                  ),
                  nrow = n_genes,
                  ncol = n_samples
                )

                storage.mode(
                  count_matrix
                ) <- "integer"

                rownames(
                  count_matrix
                ) <- paste0(
                  "gene_",
                  seq_len(n_genes)
                )

                colnames(
                  count_matrix
                ) <- sample_names

                dds <- DESeq2::DESeqDataSetFromMatrix(
                  countData = count_matrix,
                  colData = sample_data,
                  design = ~ condition
                )

                dds <- DESeq2::DESeq(
                  dds,
                  fitType = "mean",
                  quiet = TRUE
                )

                result <- DESeq2::results(
                  dds,
                  contrast = c(
                    "condition",
                    "treatment",
                    "control"
                  )
                )

                result_table <- data.frame(
                  gene_id = rownames(result),
                  as.data.frame(result),
                  check.names = FALSE
                )

                result_table <- result_table[
                  order(
                    result_table$pvalue,
                    na.last = TRUE
                  ),
                  ,
                  drop = FALSE
                ]

                write.csv(
                  head(
                    result_table,
                    20
                  ),
                  file =
                    "/tmp/deseq2_test_results.csv",
                  row.names = FALSE,
                  na = ""
                )

                paste0(
                  "OK|",
                  nrow(result_table),
                  "|",
                  ncol(count_matrix)
                )
              },
              error = function(e) {
                paste0(
                  "ERROR|",
                  conditionMessage(e)
                )
              }
            )
          `;

          const analysisResult =
            await webR.evalRString(
              analysisCode
            );

          append(
            "Analysis result: " +
            analysisResult
          );

          if (
            analysisResult.startsWith(
              "ERROR|"
            )
          ) {
            throw new Error(
              "DESeq2 analysis failed." +
              "\nR error: " +
              analysisResult.substring(
                "ERROR|".length
              )
            );
          }

          if (
            !analysisResult.startsWith(
              "OK|"
            )
          ) {
            throw new Error(
              "The DESeq2 analysis returned an unknown value." +
              "\nResult: " +
              analysisResult
            );
          }

          const resultBytes =
            await webR.FS.readFile(
              "/tmp/deseq2_test_results.csv"
            );

          const resultCsv =
            decoder.decode(
              resultBytes
            );

          show(
            "SUCCESS: DESeq2 ran in the browser." +
            "\n\n" +
            "Diagnostic HTML version: " +
            htmlVersion +
            "\n" +
            "Library version: " +
            libraryVersion +
            "\n\n" +
            "Runtime:\n" +
            runtimeInformation +
            "\n\n" +
            "DESeq2 version: " +
            loadedVersions.DESeq2 +
            "\n" +
            "locfit version: " +
            loadedVersions.locfit +
            "\n\n" +
            "Analysis result: " +
            analysisResult +
            "\n\n" +
            "Top 20 results:\n" +
            resultCsv
          );
        } catch (error) {
          console.error(
            "DESeq2 diagnostic error:",
            error
          );

          append("");
          append(
            "ERROR:"
          );

          append(
            formatError(error)
          );
        } finally {
          runButton.disabled = false;
        }
      }
    );
  </script>
</body>
</html>
