<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>webR test</title>
</head>

<body>
  <h1>webR test</h1>

  <button id="run" type="button">
    Run R
  </button>

  <pre id="output">Not started</pre>

  <script type="module">
    const output = document.getElementById("output");
    const button = document.getElementById("run");

    button.addEventListener("click", async () => {
      button.disabled = true;

      try {
        output.textContent = "Loading webR...";

        /*
         * If the npm package dist files are placed directly,
         * use the browser webr.js file instead of webr.mjs.
         */
        const {
          WebR,
          ChannelType
        } = await import("./webr/webr.js");

        const baseUrl = new URL(
          "./webr/",
          window.location.href
        ).href;

        const webR = new WebR({
          baseUrl,
          channelType: ChannelType.PostMessage
        });

        await webR.init();

        output.textContent = "Running R...";

        const result = await webR.evalRString(`
          paste(
            "R version:",
            R.version.string,
            "| 1 + 1 =",
            1 + 1
          )
        `);

        output.textContent = result;
      } catch (error) {
        console.error(error);

        output.textContent =
          "Error:\n" +
          (error?.stack || error?.message || String(error));
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
